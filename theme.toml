active_theme = "moribund"
slint_style = "native"

# UI chrome font: headings, labels, buttons, status text, etc.
# Markdown editor boxes stay monospace below.
ui_font = "IM FELL English"
ui_font_file = "assets/fonts/IMFellEnglish-Regular.ttf"

# Markdown editor font: messy input and clean Markdown output boxes.
editor_font = "monospace"
editor_font_size = 12.0
editor_font_file = ""

[themes.moribund]
app_background = "#181920"
toolbar_background = "#14151c"
panel_background = "#101117"
border_color = "#2f3140"
divider_color = "#3b4058"
heading_color = "#a77be8"
body_text_color = "#d7d4cf"
muted_text_color = "#6f7388"
status_message = "Theme changed to Moribund."

[themes.dark]
app_background = "#1e1e1e"
toolbar_background = "#2a2a2a"
panel_background = "#161616"
border_color = "#505050"
divider_color = "#5f5f5f"
heading_color = "#e6e6e6"
body_text_color = "#c8c8c8"
muted_text_color = "#969696"
status_message = "Theme changed to Plain Dark."

[themes.light]
app_background = "#f5f5f5"
toolbar_background = "#e8e8e8"
panel_background = "#ffffff"
border_color = "#bebebe"
divider_color = "#aaaaaa"
heading_color = "#232323"
body_text_color = "#414141"
muted_text_color = "#696969"
status_message = "Theme changed to Plain Light."
